<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Broadcast (Social Sync Pro) — Loading Studio</title>
    <script>
      // Single Page App redirect script for GitHub Pages.
      // Deep links like /dashboard, /composer, /library redirect to index while preserving path.
      (function () {
        var loc = window.location;
        var pathname = loc.pathname;
        var search = loc.search;
        var hash = loc.hash;

        // Extract repo sub-path if present (e.g. /FSD-Social-Sync/)
        var parts = pathname.split("/").filter(Boolean);
        var base =
          parts.length > 0 && !parts[0].includes(".")
            ? "/" + parts[0] + "/"
            : "/";

        // Pass the target route via query param so client router navigates immediately
        sessionStorage.setItem(
          "broadcast_redirect_path",
          pathname + search + hash,
        );
        window.location.replace(base);
      })();
    </script>
    <style>
      body {
        margin: 0;
        background-color: #0b0f17;
        color: #94a3b8;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        display: grid;
        min-height: 100vh;
        place-items: center;
      }
      .loader {
        text-align: center;
      }
      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(56, 189, 248, 0.2);
        border-top-color: #38bdf8;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 16px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="loader">
      <div class="spinner"></div>
      <p style="font-size: 14px; font-weight: 500">
        Restoring Broadcast Studio route…
      </p>
    </div>
  </body>
</html>
